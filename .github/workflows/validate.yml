name: Validate tvOS

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    # GitHub's macOS 27 image is currently published under this preview label.
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Show build environment
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk appletvos --show-sdk-version
      - name: Credential storage regression tests
        run: bash Tests/Credentials/run.sh
      - name: Build tvOS app without signing
        run: >-
          xcodebuild -project F1A-TV.xcodeproj -scheme F1A-TV
          -configuration Debug -destination 'generic/platform=tvOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
